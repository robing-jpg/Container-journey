  }

  // Small container character used as the narrator.
  function avatarSVG(w) {
    return `<svg viewBox="0 0 120 90" width="${w}" role="presentation">
      <rect x="6" y="14" width="108" height="62" rx="4" fill="var(--c-box)" stroke="var(--c-box-dark)" stroke-width="3"/>
      ${[20, 34, 48, 62, 76, 90, 104].map(x => `<line x1="${x}" y1="18" x2="${x}" y2="72" stroke="#000" opacity=".12" stroke-width="4"/>`).join('')}
      <circle cx="44" cy="40" r="7" fill="#fff"/><circle cx="76" cy="40" r="7" fill="#fff"/>
      <circle cx="46" cy="41" r="3.5" fill="#1B2631"/><circle cx="78" cy="41" r="3.5" fill="#1B2631"/>
      <path d="M46 56 q14 10 28 0" stroke="#1B2631" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="10" y="76" width="18" height="8" fill="#1B2631"/><rect x="92" y="76" width="18" height="8" fill="#1B2631"/>
    </svg>`;
  }

  /* ---------- Beats ---------- */
  const BEAT_CLASSES = { arrive: ['is-arrived'], stuff: ['is-stuffed'], seal: ['is-sealed'], vgm: ['is-weighing'], ready: ['is-ready'] };

  function updateBeat(instant) {
    const s = stepById(state.step);
    const beats = s.beats;
    state.beat = Math.max(0, Math.min(state.beat, beats.length - 1));
    const b = beats[state.beat];
    const svg = $('#scene');

    // Cumulative animation classes
    const prevArrived = svg.classList.contains('is-arrived');
    if (instant) svg.classList.add('instant');
    svg.setAttribute('class', '');
    if (instant) svg.classList.add('instant');
    beats.slice(0, state.beat + 1).forEach(bb => BEAT_CLASSES[bb.anim].forEach(c => svg.classList.add(c)));
    if (state.vgmMethod) svg.classList.add(state.vgmMethod);
    if (state.departed) svg.classList.add('is-departed');
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove('instant')));
    if (!instant && !prevArrived && svg.classList.contains('is-arrived')) wheelsFor(2200);

    // Narration
    $('#narrText').innerHTML = rich(L(b.narration));
    $('#caption').innerHTML = rich(L(b.caption));

    renderHotspots(s);
    renderExtra(s, b, instant);
    renderControls(s);
    renderQuestion(s);
    save();
  }

  function wheelsFor(ms) {
    const svg = $('#scene'); if (!svg || reduceMotion) return;
    svg.classList.add('moving');
    setTimeout(() => svg.classList.remove('moving'), ms);
  }

  function renderHotspots(s) {
    const layer = $('#hotspots');
    layer.innerHTML = s.hotspots.map(h => {
      const show = h.beat <= state.beat && !state.departed;
      const seen = state.seenHotspots.includes(h.id);
      return `<button type="button" class="hs ${show ? 'show' : ''} ${seen ? 'seen' : ''}" data-hs="${h.id}"
        style="left:${(h.x / 960) * 100}%;top:${(h.y / 420) * 100}%" ${show ? '' : 'tabindex="-1" aria-hidden="true"'}
        aria-label="${esc(h.label)} (${esc(h.kind)})${seen ? ', viewed' : ''}"><span class="i" aria-hidden="true">${seen ? '✓' : 'i'}</span>${esc(h.label)}</button>`;
    }).join('');
    $$('.hs', layer).forEach(btn => btn.addEventListener('click', () => {
      const h = s.hotspots.find(x => x.id === btn.dataset.hs);
      if (!state.seenHotspots.includes(h.id)) state.seenHotspots.push(h.id);
      save();
      openModal(h.label, `<p>${rich(L(h.body))}</p>`, h.kind, btn, () => renderHotspots(s));
    }));
  }

  function renderControls(s) {
    const last = state.beat === s.beats.length - 1;
    const solved = isSolved(s);
    $('#controls').innerHTML = `
      <button class="btn secondary" id="bBack" ${state.beat === 0 ? 'disabled' : ''}>◀ ${esc(C.ui.back)}</button>
      <div class="dots" aria-label="Scene ${state.beat + 1} of ${s.beats.length}">
        ${s.beats.map((_, i) => `<span class="dot ${i <= state.beat ? 'on' : ''}" aria-hidden="true"></span>`).join('')}
        <span>${state.beat + 1} / ${s.beats.length}</span>
      </div>
      ${last ? (state.showQuestion || solved ? '<span></span>' : `<button class="btn" id="bNext">${esc(C.ui.whatNext)}</button>`)
             : `<button class="btn" id="bNext" ${s.beats[state.beat].interactive === 'vgm' && !state.vgmMethod ? 'disabled title="Pick a VGM method first"' : ''}>${esc(C.ui.next)} ▶</button>`}`;
    const back = $('#bBack'), next = $('#bNext');
    if (back) back.addEventListener('click', () => { state.beat--; state.showQuestion = false; updateBeat(false); });
    if (next) next.addEventListener('click', () => {
      if (last) { state.showQuestion = true; updateBeat(false); const q = $('#qTitle'); if (q) q.focus(); }
      else { state.beat++; updateBeat(false); const n = $('#bNext'); if (n && !n.disabled) n.focus(); }
    });
  }

  /* ---------- VGM calculator (beat with interactive: "vgm") ---------- */
  function renderExtra(s, b, instant) {
    const box = $('#extra');
    if (b.interactive !== 'vgm') { box.innerHTML = ''; return; }
    const m = state.vgmMethod;
    const data = m ? s.vgm[m === 'm1' ? 'method1' : 'method2'] : null;
    box.innerHTML = `
      <div class="vgm card">
        <div class="vgm-tabs" role="group" aria-label="Choose a VGM method">
          <button type="button" data-m="m1" aria-pressed="${m === 'm1'}">${esc(L(s.vgm.method1.title))}</button>
          <button type="button" data-m="m2" aria-pressed="${m === 'm2'}">${esc(L(s.vgm.method2.title))}</button>
        </div>
        ${data ? `
          <table class="calc"><caption class="sr-only">${esc(L(data.title))}</caption><tbody>
            ${data.rows.map((r, i) => `<tr style="animation-delay:${i * 0.35}s"><td>${rich(r.label)}</td><td>${fmtKg(r.kg)}</td></tr>`).join('')}
            <tr class="total" style="animation-delay:${data.rows.length * 0.35}s"><td>VGM</td><td>${fmtKg(s.vgm.totalKg)}</td></tr>
          </tbody></table>
          <p class="muted" style="margin:8px 0 0;font-size:.88rem">${rich(L(data.note))}</p>
          <p style="margin:6px 0 0;font-size:.88rem">Both methods must give the same result: <strong>${fmtKg(s.vgm.totalKg)}</strong>. Try the other one!</p>`
        : `<p class="muted" style="margin:0">Select a method to see the calculation.</p>`}
      </div>`;
    $$('.vgm-tabs button', box).forEach(btn => btn.addEventListener('click', () => {
      const changed = state.vgmMethod !== btn.dataset.m;
      state.vgmMethod = btn.dataset.m;
      updateBeat(false);
      if (changed && state.vgmMethod === 'm1') countUp(s.vgm.method1.rows[0].kg);
      const again = $(`.vgm-tabs button[data-m="${state.vgmMethod}"]`); if (again) again.focus();
    }));
    if (m === 'm1') { const t = $('#wbNum'); if (t) t.textContent = fmtKg(s.vgm.method1.rows[0].kg); }
  }

  function countUp(target) {
    const t = $('#wbNum'); if (!t) return;
    if (reduceMotion) { t.textContent = fmtKg(target); return; }
    const start = performance.now(), dur = 1400;
    const tick = now => { const p = Math.min(1, (now - start) / dur); t.textContent = fmtKg(Math.round(target * (1 - Math.pow(1 - p, 3)) / 10) * 10); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }

  /* ---------- "What happens next?" question ---------- */
  function qKey(s) { return `${s.id}-${state.level}`; }
  function qState(s) {
    const k = qKey(s);
    if (!state.q[k]) {
      const Q = L(s.question);
      // If the step was already solved at another level, show this level's question already answered (progress is kept).
      const done = (state.solvedSteps || []).includes(s.id);
      state.q[k] = { order: seededShuffle(Q.options.map(o => o.id), k + '-' + state.runId), ruled: [], hint: false, solved: done, revealed: false, last: done ? { type: 'right' } : null };
    }
    return state.q[k];
  }
  function isSolved(s) { return state.completed.includes(s.id) || (state.solvedSteps || []).includes(s.id); }
  function markSolved(s) { state.solvedSteps = state.solvedSteps || []; if (!state.solvedSteps.includes(s.id)) state.solvedSteps.push(s.id); }

  function seededShuffle(arr, seedStr) {
    let h = 2166136261; for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
    const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function renderQuestion(s) {
    const area = $('#qArea');
    const last = state.beat === s.beats.length - 1;
    if (state.completed.includes(s.id) && state.departed) { area.innerHTML = completionCard(s); bindCompletion(s); return; }
    if (!last || !(state.showQuestion || isSolved(s))) { area.innerHTML = ''; return; }
    const Q = L(s.question); const qs = qState(s);
    const opt = id => Q.options.find(o => o.id === id);
    const letters = 'ABCD';
    let fb = '';
    if (qs.last && qs.last.type === 'wrong') {
      const o = opt(qs.last.id);
      fb = `<div class="fb wrong"><h4 id="fbHead" tabindex="-1"><span aria-hidden="true">✗ </span>${esc(C.ui.wrongHeadings[Math.min(qs.ruled.length - 1, C.ui.wrongHeadings.length - 1)])}</h4>
        <p><span class="k">Why not yet: </span>${rich(o.why)}</p>
        <p><span class="k">In real life: </span>${rich(o.realLife)}</p>
        <p><span class="k">When it would be right: </span>${rich(o.whenRight)}</p>
        <div class="fb-actions"><button class="btn" id="qRetry">${esc(C.ui.tryAgain)}</button><button class="btn secondary" id="qReveal">${esc(C.ui.reveal)}</button></div></div>`;
    } else if (qs.solved) {
      const right = Q.options.find(o => o.correct);
      fb = `<div class="fb right"><h4 id="fbHead" tabindex="-1"><span aria-hidden="true">✓ </span>${esc(qs.revealed ? C.ui.revealHeading : C.ui.rightHeading)}</h4>
        <p>${rich(right.confirm)}</p>
        ${state.departed ? '' : `<div class="fb-actions"><button class="btn" id="qContinue">${esc(C.ui.continue)} ▶</button></div>`}</div>`;
    }
    area.innerHTML = `
      <div class="q" role="group" aria-labelledby="qTitle">
        <h3 id="qTitle" tabindex="-1"><span aria-hidden="true">❓</span> ${esc(C.ui.whatNext)}</h3>
        <p>${rich(Q.prompt)}</p>
        <div class="opts">
          ${qs.order.map((id, i) => {
            const o = opt(id); const ruled = qs.ruled.includes(id); const right = qs.solved && o.correct;
            const dis = ruled || qs.solved;
            return `<button type="button" class="opt ${ruled ? 'ruled' : ''} ${right ? 'right' : ''}" data-opt="${id}" ${dis ? 'disabled' : ''}
              aria-label="Option ${letters[i]}: ${esc(plain(o.text))}${ruled ? ' — ruled out' : ''}${right ? ' — correct answer' : ''}">
              <span class="letter" aria-hidden="true">${letters[i]}</span><span aria-hidden="true">${rich(o.text)}</span>
              ${ruled ? '<span class="state" aria-hidden="true">✗ ruled out</span>' : ''}${right ? '<span class="state" aria-hidden="true">✓ correct</span>' : ''}</button>`;
          }).join('')}
        </div>
        ${Q.hint && !qs.solved ? (qs.hint ? `<p class="hint"><strong>Hint:</strong> ${rich(Q.hint)}</p>` : `<button class="linkbtn" id="qHint">${esc(C.ui.hint)}</button>`) : ''}
        <div aria-live="polite">${fb}</div>
      </div>`;

    $$('.opt', area).forEach(b => b.addEventListener('click', () => answer(s, b.dataset.opt)));
    const h = $('#qHint'); if (h) h.addEventListener('click', () => { qs.hint = true; updateBeat(false); });
    const r = $('#qRetry'); if (r) r.addEventListener('click', () => { qs.last = null; updateBeat(false); const f = $('.opt:not([disabled])', $('#qArea')); if (f) f.focus(); });
    const rv = $('#qReveal'); if (rv) rv.addEventListener('click', () => { qs.solved = true; qs.revealed = true; qs.last = { type: 'reveal' }; markSolved(s); recordScore(s, false); updateBeat(false); focusFb(); });
    const c = $('#qContinue'); if (c) c.addEventListener('click', () => depart(s));
  }

  function answer(s, id) {
    const Q = L(s.question); const qs = qState(s);
    const o = Q.options.find(x => x.id === id);
    if (o.correct) {
      recordScore(s, true);
      qs.solved = true; qs.last = { type: 'right' }; markSolved(s);
    } else {
      recordScore(s, false);
      if (!qs.ruled.includes(id)) qs.ruled.push(id);
      qs.last = { type: 'wrong', id };
      if (o.avoided && !state.avoided.some(a => a.key === `${s.id}-${state.level}-${id}`)) {
        state.avoided.push(Object.assign({ key: `${s.id}-${state.level}-${id}` }, o.avoided));
      }
      $('#meter').innerHTML = costMeter(s);
    }
    updateBeat(false); focusFb();
  }
  function focusFb() { const f = $('#fbHead'); if (f) f.focus(); }

  // Score = first answer per step only (switching level or replaying doesn't change it).
  function recordScore(s, correct) {
    if (state.scores[s.id]) return;
    state.scores[s.id] = { firstTry: correct, level: state.level, hint: !!qState(s).hint };
    renderHeader();
  }

  function depart(s) {
    if (!state.completed.includes(s.id)) state.completed.push(s.id);
    state.departed = true; save();
    const svg = $('#scene'); svg.classList.add('is-departed'); wheelsFor(2600);
    $$('.hs').forEach(h => h.classList.remove('show'));
    setTimeout(() => { renderJourney($('#main')); const t = $('#doneTitle'); if (t) t.focus(); }, reduceMotion ? 0 : 2700);
  }

  function completionCard(s) {
    return `<div class="q" role="region" aria-labelledby="doneTitle">
      <h3 id="doneTitle" tabindex="-1"><span aria-hidden="true">✓</span> Step ${s.id} complete — the container is on its way to the terminal</h3>
      <p><strong>Key learnings</strong></p>
      <ul>${L(s.learnings).map(l => `<li>${rich(l)}</li>`).join('')}</ul>
      <div class="fb-actions">
        <button class="btn" id="dSummary">See pilot summary</button>
        <button class="btn secondary" id="dReplay">Replay this step</button>
      </div>
      <p class="muted" style="margin-top:10px;font-size:.88rem">Tip: switch to ${state.level === 1 ? 'Level 2' : 'Level 1'} in the header and replay to compare depths. Your first-try score is kept.</p>
    </div>`;
  }
  function bindCompletion(s) {
    $('#dSummary').addEventListener('click', () => { state.screen = 'summary'; save(); render(); $('#main').focus(); });
    $('#dReplay').addEventListener('click', () => replay(s));
  }
  function replay(s) {
    Object.assign(state, { beat: 0, departed: false, showQuestion: false, vgmMethod: null });
    Object.keys(state.q).filter(k => k.startsWith(s.id + '-')).forEach(k => delete state.q[k]);
    state.solvedSteps = (state.solvedSteps || []).filter(id => id !== s.id);
    state.completed = state.completed.filter(id => id !== s.id);
    save(); renderJourney($('#main')); // renderJourney replays the arrival animation at beat 0
  }

  /* ---------- Side panel ("step file") ---------- */
  function sidePanel(s) {
    const lens = s.incotermLens && s.incotermLens[state.incoterm];
    return `
      <h3>Step file</h3>
      ${lens ? `<details open><summary>Incoterm lens: ${state.incoterm}</summary><div class="body"><p>${rich(L(lens))}</p></div></details>` : ''}
      ${s.panels.map((p, i) => `<details ${i === 0 ? 'open' : ''}><summary>${esc(p.title)}</summary><div class="body"><ul>${L(p.items).map(t => `<li>${rich(t)}</li>`).join('')}</ul></div></details>`).join('')}`;
  }

  /* ---------- Cost & time meter (illustrative) ---------- */
  function costMeter(s) {
    const ic = C.incoterms[state.incoterm];
    const day = s.day || 1, free = T.detentionFreeDays;
    const cells = Array.from({ length: free }, (_, i) => `<span class="${i < day ? 'used' : ''}"></span>`).join('');
    const avoided = state.avoided.map(a => {
      const amt = a.feeKey ? T[a.feeKey] * (a.qty || 1) : null;
      return `<li>${esc(a.label)}${amt != null ? ` — ≈ ${T.currency}${amt.toLocaleString('en-GB')}` : ''}</li>`;
    }).join('');
    return `<div class="card meter" aria-labelledby="meterT">
      <h3 id="meterT">Cost &amp; time meter <span class="badge-ill">ILLUSTRATIVE</span></h3>
      <p style="margin:0;font-size:.88rem"><strong>Detention clock:</strong> day ${day} of ${free} free days ${rich('[TO VERIFY:v12]')}</p>
      <div class="clock" role="img" aria-label="Day ${day} of ${free} free days used">${cells}</div>
      <p style="margin:0;font-size:.88rem">No charge yet. Ocean freight: booked &amp; paid by <strong>${esc(ic.freight.toLowerCase())}</strong> (${state.incoterm}).</p>
      ${avoided ? `<p style="margin:10px 0 0;font-size:.88rem"><strong>What your wrong turns would have cost:</strong></p><ul>${avoided}</ul>` : ''}
    </div>`;
  }

  /* ---------- Summary (pilot) ---------- */
  function renderSummary(main) {
    const sc = scoreStats();
    const pct = sc.answered ? Math.round(sc.first / sc.answered * 100) : 0;
    const lvl = C.levels.find(l => l.id === state.level);
    const next = C.levels.find(l => l.id === state.level + 1);
    const review = Object.keys(state.scores).filter(id => !state.scores[id].firstTry).map(id => stepById(+id));
    const learnings = state.completed.map(id => stepById(id)).filter(s => s.learnings);
    main.innerHTML = `
      ${journeyBar()}
      <section class="card" aria-labelledby="sumT">
        <h1 id="sumT">Pilot summary</h1>
        <div class="summary-grid">
          <div>
            <p class="muted">Level played: <strong>${esc(lvl.name)}</strong> · Route: ${esc(C.routes.find(r => r.id === state.route).name)} · Incoterm: ${state.incoterm}</p>
            <p><span class="big">${pct}%</span><br>correct at first try (${sc.first} of ${sc.answered} question${sc.answered === 1 ? '' : 's'})</p>
            ${pct > 80 && next ? `<p class="fb right">Great result! Next time, try <strong>${esc(next.name)}</strong>${next.available ? '' : ' (coming in the final version)'}.</p>` : ''}
            <h2 style="font-size:1.05rem">Steps to review</h2>
            ${review.length ? `<ul>${review.map(s => `<li>Step ${s.id} — ${esc(s.title)}</li>`).join('')}</ul>` : '<p>None — well done.</p>'}
          </div>
          <div>
            <h2 style="font-size:1.05rem">Key learnings</h2>
            ${learnings.map(s => `<ul>${L(s.learnings).map(l => `<li>${rich(l)}</li>`).join('')}</ul>`).join('')}
          </div>
        </div>
        <div class="fb-actions">
          <button class="btn" id="sAgain">New journey (other Incoterm or level)</button>
          <button class="btn secondary" id="sBack">Back to step 2</button>
        </div>
      </section>`;
    bindJourneyBar(main);
    $('#sAgain').addEventListener('click', () => { state.screen = 'setup'; save(); render(); });
    $('#sBack').addEventListener('click', () => { state.screen = 'journey'; save(); render(); });
  }

  /* ---------- Modal ---------- */
  let modalReturn = null, modalOnClose = null;
  function openModal(title, html, kind, opener, onClose) {
    closePop();
    modalReturn = opener || document.activeElement; modalOnClose = onClose || null;
    const m = $('#modal');
    m.innerHTML = `<button class="close" aria-label="Close">×</button>${kind ? `<span class="tag">${esc(kind)}</span>` : ''}<h2 id="modalTitle" style="margin-top:8px">${esc(title)}</h2>${html}
      <div class="fb-actions"><button class="btn" data-close>Got it</button></div>`;
    m.classList.add('open'); $('#overlay').classList.add('open');
    $$('.close,[data-close]', m).forEach(b => b.addEventListener('click', closeModal));
    $('.close', m).focus();
  }
  function closeModal() {
    const m = $('#modal'); if (!m.classList.contains('open')) return;
    m.classList.remove('open'); if (!$('#drawer').classList.contains('open')) $('#overlay').classList.remove('open');
    const cb = modalOnClose; modalOnClose = null; if (cb) cb();
    const r = modalReturn; modalReturn = null;
    if (r && document.body.contains(r)) r.focus();
    else if (r && r.dataset && r.dataset.hs) { const again = $(`[data-hs="${r.dataset.hs}"]`); if (again) again.focus(); }
  }

  /* ---------- Glossary drawer ---------- */
  let drawerReturn = null;
  function openGlossary(opener, focusTerm) {
    drawerReturn = opener; const d = $('#drawer');
    const keys = Object.keys(C.glossary).sort((a, b) => C.glossary[a].term.localeCompare(C.glossary[b].term));
    d.innerHTML = `<button class="close" aria-label="Close glossary">×</button><h2 id="drawerTitle">Glossary</h2>
      <label class="sr-only" for="gSearch">Search the glossary</label><input id="gSearch" type="search" placeholder="Search a term…">
      <dl id="gList">${keys.map(k => `<div data-g="${k}" id="g-${k}"><dt>${esc(C.glossary[k].term)}</dt><dd>${rich(C.glossary[k].def)}</dd></div>`).join('')}</dl>`;
    d.classList.add('open'); $('#overlay').classList.add('open');
    $('.close', d).addEventListener('click', closeDrawer);
    $('#gSearch').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      $$('#gList > div').forEach(el => { el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none'; });
    });
    if (focusTerm) { const el = $('#g-' + focusTerm); if (el) { el.scrollIntoView({ block: 'center' }); el.style.background = 'var(--c-primary-soft)'; } }
    $('#gSearch').focus();
  }
  function closeDrawer() {
    const d = $('#drawer'); if (!d.classList.contains('open')) return;
    d.classList.remove('open'); if (!$('#modal').classList.contains('open')) $('#overlay').classList.remove('open');
    if (drawerReturn && document.body.contains(drawerReturn)) drawerReturn.focus();
  }

  /* ---------- Verification list ---------- */
  function openVerification(highlight, opener) {
    const raw = document.getElementById('content-data').textContent + JSON.stringify(CONFIG);
    const count = id => (raw.match(new RegExp('\\[TO VERIFY:' + id + '\\]', 'g')) || []).length;
    openModal('Verification list', `
      <p>Every item flagged <span class="vchip" style="cursor:default">TO VERIFY</span> must be checked against its source and signed off by a team member before deployment.</p>
      <ol class="vlist">${C.verification.map(v => `<li id="vl-${v.id}" class="${v.id === highlight ? 'hl' : ''}"><strong>${v.id}</strong> — ${esc(v.claim)}<br><span class="muted">Source: ${esc(v.source)} · flagged ${count(v.id)}×</span></li>`).join('')}</ol>`, 'Content QA', opener);
    if (highlight) { const el = $('#vl-' + highlight); if (el) el.scrollIntoView({ block: 'center' }); }
  }

  /* ---------- Glossary popover (inline terms) ---------- */
  let popReturn = null;
  function openPop(btn) {
    const g = C.glossary[btn.dataset.term]; if (!g) return;
    const p = $('#pop'); popReturn = btn;
    p.innerHTML = `<h4 id="popTitle">${esc(g.term)}</h4><p style="margin:0 0 8px">${rich(g.def)}</p>
      <button class="linkbtn" id="popAll">Open glossary</button> · <button class="linkbtn" id="popClose">Close</button>`;
    const r = btn.getBoundingClientRect();
    const left = Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 316);
    p.style.left = Math.max(8, left) + 'px'; p.style.top = (window.scrollY + r.bottom + 6) + 'px';
    p.classList.add('open');
    $('#popClose').addEventListener('click', () => closePop(true));
    $('#popAll').addEventListener('click', () => { const id = btn.dataset.term; closePop(false); openGlossary(btn, id); });
    $('#popClose').focus();
  }
  function closePop(refocus) { const p = $('#pop'); if (!p.classList.contains('open')) return; p.classList.remove('open'); if (refocus && popReturn && document.body.contains(popReturn)) popReturn.focus(); }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('open'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('open'), 3500); }

  /* ---------- Global events (delegation) ---------- */
  document.addEventListener('click', e => {
    const term = e.target.closest('.term');
    if (term) { e.preventDefault(); openPop(term); return; }
    const v = e.target.closest('.vchip[data-verify]');
    if (v) { e.preventDefault(); closePop(); openVerification(v.dataset.verify, v); return; }
    if (!e.target.closest('#pop')) closePop();
  });
  $('#overlay').addEventListener('click', () => { closeModal(); closeDrawer(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#pop').classList.contains('open')) closePop(true); else if ($('#modal').classList.contains('open')) closeModal(); else closeDrawer(); }
    // Keep Tab focus inside an open modal or drawer
    if (e.key === 'Tab') {
      const open = $('#modal.open') || $('#drawer.open'); if (!open) return;
      const f = $$('button, input, select, [tabindex]:not([tabindex="-1"])', open).filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  /* ---------- Start-up ---------- */
  applyConfig();
  if (!C.incoterms[state.incoterm] || !C.incoterms[state.incoterm].available) state.incoterm = 'FCA';
  if (!C.levels.find(l => l.id === state.level && l.available)) state.level = 1;
  render();

  // Exposed for testing/debugging in the console only.
  window.__journey = { state: () => state, reset: () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} location.reload(); } };
})();
</script>
</body>
